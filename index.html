<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>期末急救分诊台 — 挂科风险一键排查</title>
  <meta name="description" content="期末急救分诊台:录入各门课的平时分、占比和目标,自动诊断挂科风险,按危重程度排序,一键生成病危通知书。纯本地计算,无追踪。">
  <meta name="theme-color" content="#7A0C0C">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:title" content="期末急救分诊台">
  <meta property="og:description" content="多门课挂科风险一键排查:危重排序 + 病危通知书分享">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/calc.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true"></div>
        <div>
          <div class="brand-name">期末急救分诊台</div>
          <div class="brand-sub">First-Aid Triage · 挂科风险排查</div>
        </div>
      </div>
      <button class="stats-badge" id="statsBadge" type="button" aria-haspopup="dialog">⏱️ 今日分诊 <span id="statsCount">0</span> 例</button>
    </header>

    <section class="report" aria-label="分诊总览">
      <div class="report-title">分 诊 总 览</div>
      <div class="report-grid" id="reportGrid">
        <div class="stat is-critical"><b id="sumCritical">0</b><span>病危</span></div>
        <div class="stat is-severe"><b id="sumSevere">0</b><span>重症</span></div>
        <div class="stat is-mild"><b id="sumMild">0</b><span>轻症</span></div>
        <div class="stat is-discharged"><b id="sumDischarged">0</b><span>已出院</span></div>
      </div>
      <p class="verdict" id="verdict" aria-live="polite">还没有病例,先在下面添加一门课。</p>
    </section>

    <main class="cases" id="cases" aria-label="病例列表">
      <p class="empty" id="emptyHint">🚑 还没有病例——点下方「新增病例」,把挂科风险一门门揪出来</p>
    </main>

    <div class="actions">
      <button class="btn btn-add" id="btnAdd" type="button">➕ 新增病例</button>
      <button class="btn btn-main" id="btnTriage" type="button">
        🚑 开始分诊
        <span class="sub">按危重程度重新排序,最急的排最前</span>
      </button>
      <button class="btn btn-notice" id="btnNotice" type="button">📋 生成病危通知书</button>
    </div>

    <footer class="foot">
      纯本地计算 · 成绩数据不出浏览器 · <a href="https://github.com/shangjian2023/exam-saving">源码</a><br>
      单门课精细计算(含期中)见姊妹项目
      <a href="https://shangjian2023.github.io/pass-or-fail/" target="_blank" rel="noopener">期末急救计算器</a>
    </footer>
  </div>

  <!-- 病危通知书 -->
  <div class="overlay" id="noticeOverlay" role="dialog" aria-modal="true" aria-labelledby="noticeStamp">
    <div class="modal">
      <button class="modal-close" data-close type="button" aria-label="关闭">×</button>
      <div class="notice-stamp" id="noticeStamp">病危通知书</div>
      <div class="notice-date" id="noticeDate"></div>
      <ul class="notice-list" id="noticeList"></ul>
      <p class="notice-advice" id="noticeAdvice"></p>
      <div class="notice-actions">
        <button class="btn btn-solid" id="btnCopyText" type="button">📋 复制文本</button>
        <button class="btn btn-ghost" id="btnShareLink" type="button">🔗 复制/分享链接</button>
      </div>
    </div>
  </div>

  <!-- 急救运势(彩蛋) -->
  <div class="overlay" id="luckOverlay" role="dialog" aria-modal="true" aria-labelledby="luckTitle">
    <div class="modal">
      <button class="modal-close" data-close type="button" aria-label="关闭">×</button>
      <div class="luck-title" id="luckTitle">今日急救运势</div>
      <div class="luck-grid">
        <div class="luck-cell">
          <b id="luckCount">0</b><span>今日分诊(本地记录)</span>
        </div>
        <div class="luck-cell">
          <b id="luckValue">0%</b><span>急救加成</span>
          <div class="luck-bar"><div class="luck-fill" id="luckFill"></div></div>
        </div>
      </div>
      <button class="btn btn-solid" style="width:100%" data-close type="button">领取好运 ✨</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // PWA:Service Worker(子路径部署,必须用相对路径注册)
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  </script>
</body>
</html>
